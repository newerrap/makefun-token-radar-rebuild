<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Token Radar</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">MAKE.FUN / TOKEN LAUNCH RADAR</p>
          <h1>Token Radar</h1>
          <p class="sub">A disciplined watchlist for protocols before the ticker.</p>
          <p id="method" class="method"></p>
        </div>
        <div class="date" id="date"></div>
      </header>
      <section class="stats" id="stats"></section>
      <section id="board">
        <div class="controls">
          <input id="search" placeholder="Search protocol or slug…">
          <select id="category">
            <option value="">All categories</option>
          </select>
          <select id="chain">
            <option value="">All chains</option>
          </select>
          <label>
            <input type="checkbox" id="watch">
            Watchlist only
          </label>
        </div>
        <div class="tablewrap">
          <table>
            <thead>
              <tr>
                <th data-key="rank">Rank</th>
                <th data-key="name">Protocol</th>
                <th data-key="category">Category</th>
                <th data-key="tvl_usd">TVL</th>
                <th data-key="multiple">Multiple</th>
                <th data-key="implied_value_usd">Implied launch value</th>
                <th data-key="change_7d">7d</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </section>
      <section id="detail" hidden></section>
    </main>
    <script src="../data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
